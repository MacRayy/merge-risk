name: merge-risk

# pull_request_target runs this file and the action as they are on the base branch, so a PR
# can't rewrite the gate that judges it. Nothing here checks out or runs the PR's code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: merge-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # The base branch's copy of this repo, which is the action under test here.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: ./
