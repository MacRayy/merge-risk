name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn type-check
      - run: yarn test
      - run: yarn format-check
      - name: Check that the tree matches the source
        run: |
          yarn build
          # status, unlike diff, also catches a bundle file that was never committed. The whole tree,
          # not only dist/: yarn install also rewrites package.json, and the release refuses that too.
          if [ -n "$(git status --porcelain)" ]; then
            echo "The install or build changed tracked files: run them and commit the result."
            git status --porcelain
            exit 1
          fi
